# ============================================================
# CD – Workflow réutilisable : Build & Push vers GHCR
#
# Appelé par cd-dev.yml, cd-test.yml et cd-prod.yml.
# Ne se déclenche jamais directement.
#
# Images publiées :
#   ghcr.io/<owner>/coordinationfb-api:<tag>
#   ghcr.io/<owner>/coordinationfb-web:<tag>
#
# Inputs :
#   image_tag    – tag principal (dev | test | latest)
#   environment  – nom de l'environnement GitHub
#   vite_api_url – URL de l'API injectée dans le build Vite
#   extra_tag    – tag supplémentaire optionnel (ex: SHA court pour prod)
# ============================================================
name: CD – Build & Push GHCR (réutilisable)

on:
  workflow_call:
    inputs:
      image_tag:
        type: string
        required: true
      environment:
        type: string
        required: true
      vite_api_url:
        type: string
        required: false
        default: "http://localhost:3000"
      extra_tag:
        type: string
        required: false
        default: ""

# Permissions nécessaires pour écrire dans GHCR
permissions:
  contents: read
  packages: write

# Un seul build à la fois par environnement
concurrency:
  group: ghcr-push-${{ inputs.environment }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: "Build & Push → :${{ inputs.image_tag }}"
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- Authentification GHCR (token GitHub automatique) ----
      - name: Se connecter à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---- Mise en cache des layers Docker ----
      - name: Configurer le cache Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---- Normalisation du nom du dépôt en minuscules ----
      - name: Calculer le nom de base des images
        id: image-base
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "backend=ghcr.io/${REPO}/coordinationfb-api" >> $GITHUB_OUTPUT
          echo "frontend=ghcr.io/${REPO}/coordinationfb-web" >> $GITHUB_OUTPUT

      # ---- Build et push du backend ----
      - name: Build & Push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.image-base.outputs.backend }}:${{ inputs.image_tag }}
            ${{ inputs.extra_tag != '' && format('{0}:{1}', steps.image-base.outputs.backend, inputs.extra_tag) || '' }}
          cache-from: type=gha,scope=backend-${{ inputs.image_tag }}
          cache-to:   type=gha,scope=backend-${{ inputs.image_tag }},mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      # ---- Build et push du frontend ----
      - name: Build & Push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=${{ inputs.vite_api_url }}
          tags: |
            ${{ steps.image-base.outputs.frontend }}:${{ inputs.image_tag }}
            ${{ inputs.extra_tag != '' && format('{0}:{1}', steps.image-base.outputs.frontend, inputs.extra_tag) || '' }}
          cache-from: type=gha,scope=frontend-${{ inputs.image_tag }}
          cache-to:   type=gha,scope=frontend-${{ inputs.image_tag }},mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      # ---- Résumé affiché dans l'onglet Actions ----
      - name: Résumé du build
        run: |
          echo "## 🐳 Images publiées sur GHCR" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Tag |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| \`coordinationfb-api\` | \`:${{ inputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`coordinationfb-web\` | \`:${{ inputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ inputs.extra_tag }}" ]; then
            echo "| \`coordinationfb-api\` | \`:${{ inputs.extra_tag }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| \`coordinationfb-web\` | \`:${{ inputs.extra_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit :** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
