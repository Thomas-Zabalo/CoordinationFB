# ============================================================
# CD – Workflow réutilisable (logique de déploiement commune)
#
# Appelé par cd-dev.yml, cd-test.yml et cd-prod.yml.
# Ne se déclenche jamais directement.
#
# Inputs attendus :
#   environment  – nom de l'env GitHub (development | test | production)
#   api_url      – URL publique de l'API pour le build Vite
#
# Secrets attendus (passés par l'appelant) :
#   deploy_host  – IP ou hostname du serveur cible
#   deploy_user  – Utilisateur SSH
#   deploy_ssh_key – Clé privée SSH
#   deploy_path  – Chemin de déploiement sur le serveur
# ============================================================
name: CD – Deploy (réutilisable)

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      api_url:
        required: true
        type: string
    secrets:
      deploy_host:
        required: true
      deploy_user:
        required: true
      deploy_ssh_key:
        required: true
      deploy_path:
        required: true

# Un seul déploiement à la fois par environnement
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------
  # Étape 1 : Build du frontend avec l'URL de l'API cible
  # ----------------------------------------------------------
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Build Vite
        run: npm run build
        env:
          VITE_API_URL: ${{ inputs.api_url }}

      - name: Upload artefact dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ inputs.environment }}
          path: frontend/dist
          retention-days: 1

  # ----------------------------------------------------------
  # Étape 2 : Déploiement SSH sur le serveur cible
  # ----------------------------------------------------------
  deploy:
    name: Déployer → ${{ inputs.environment }}
    runs-on: ubuntu-latest
    needs: build-frontend
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Télécharger l'artefact frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist-${{ inputs.environment }}
          path: frontend/dist

      - name: Configurer la clé SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.deploy_ssh_key }}

      - name: Ajouter le serveur aux known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.deploy_host }} >> ~/.ssh/known_hosts

      - name: Synchroniser le backend
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='data' \
            backend/ \
            ${{ secrets.deploy_user }}@${{ secrets.deploy_host }}:${{ secrets.deploy_path }}/backend/

      - name: Synchroniser le frontend (fichiers statiques)
        run: |
          rsync -az --delete \
            frontend/dist/ \
            ${{ secrets.deploy_user }}@${{ secrets.deploy_host }}:${{ secrets.deploy_path }}/frontend/dist/

      - name: Installer les deps backend et redémarrer PM2
        run: |
          ssh ${{ secrets.deploy_user }}@${{ secrets.deploy_host }} "
            cd ${{ secrets.deploy_path }}/backend
            npm ci --omit=dev
            pm2 startOrRestart ecosystem.config.cjs --env ${{ inputs.environment }}
          "

      - name: Résumé
        run: |
          echo "✅ Déploiement ${{ inputs.environment }} terminé"
          echo "   Commit  : ${{ github.sha }}"
          echo "   Branche : ${{ github.ref_name }}"
