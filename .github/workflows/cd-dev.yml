# ============================================================
# CD – Développement
# Push sur `dev` → images taguées :dev sur GHCR
# ============================================================
name: CD – Développement

on:
  push:
    branches:
      - dev

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publier les images :dev
    uses: ./.github/workflows/cd-deploy.yml
    with:
      environment:  development
      image_tag:    dev
      vite_api_url: http://localhost:3000
