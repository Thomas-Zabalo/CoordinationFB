# ============================================================
# CD – Production
# Push sur `main` → images taguées :latest ET :<sha-court> sur GHCR
# Le double tag permet de rollback en réutilisant le SHA
# ============================================================
name: CD – Production

on:
  push:
    branches:
      - main

jobs:
  # Calcul du SHA court (les expressions ne sont pas évaluées dans `with` des reusable workflows)
  prepare:
    name: Préparer le SHA court
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.sha.outputs.short }}
    steps:
      - name: Calculer le SHA court
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

  publish:
    name: Publier les images :latest + :sha
    needs: prepare
    uses: ./.github/workflows/cd-deploy.yml
    with:
      environment:  production
      image_tag:    latest
      extra_tag:    ${{ needs.prepare.outputs.short_sha }}
      vite_api_url: http://localhost:3000
