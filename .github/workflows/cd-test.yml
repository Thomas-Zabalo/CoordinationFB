# ============================================================
# CD – Test / Staging
# Push sur `test` → images taguées :test sur GHCR
# ============================================================
name: CD – Test

on:
  push:
    branches:
      - test

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publier les images :test
    uses: ./.github/workflows/cd-deploy.yml
    with:
      environment:  test
      image_tag:    test
      vite_api_url: http://localhost:3000
