# =============================================================================
# Configuration Flyway pour CoordinationFB
# =============================================================================
# Compatible avec la CLI Flyway officielle, Gradle, Maven, et Docker.
# =============================================================================

flyway.url=jdbc:sqlite:./data/vinyles.db
flyway.locations=filesystem:src/db/migrations
flyway.table=flyway_schema_history
flyway.baselineOnMigrate=true
flyway.cleanDisabled=false
