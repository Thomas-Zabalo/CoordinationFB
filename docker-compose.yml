# ============================================================
# docker-compose.yml – CoordinationFB
#
# Utilisation locale (build depuis les sources) :
#   docker compose up --build
#
# Utilisation avec les images publiées sur GHCR :
#   IMAGE_TAG=dev docker compose -f docker-compose.ghcr.yml up
# ============================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: coordinationfb-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # La base SQLite est persistée dans un volume Docker nommé
      - sqlite-data:/app/data
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_PATH: /app/data/vinyles.db
      CORS_ORIGIN: http://localhost
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/vinyles"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Pointe vers le backend exposé sur la machine hôte
        VITE_API_URL: http://localhost:3000
    container_name: coordinationfb-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  sqlite-data:
    name: coordinationfb-sqlite
